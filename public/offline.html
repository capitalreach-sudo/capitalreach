<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — CapitalReach</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #F5F0E8; color: #1A1612;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px; text-align: center;
  }
  .mark { width: 44px; height: 44px; margin: 0 auto 28px; display: block; }
  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700; font-size: 26px; letter-spacing: -0.02em; margin: 0 0 10px;
  }
  p { margin: 0 auto; max-width: 34ch; font-size: 14px; line-height: 1.6; color: #3D3630; }
  button {
    margin-top: 28px; padding: 10px 22px; border: 0; border-radius: 6px;
    background: #B5651D; color: #F5F0E8; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #8A4A15; }
</style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <rect x="16" y="16" width="32" height="32" rx="2" fill="none"
            stroke="#B5651D" stroke-width="3.5" transform="rotate(45 32 32)"/>
    </svg>
    <h1>You're offline</h1>
    <p>CapitalReach needs a connection to show live listings and deal activity. Reconnect and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
